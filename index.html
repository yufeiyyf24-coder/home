function notify(message, action = null) {
  const toast = $('#toast');
  toast.innerHTML = '<span>' + esc(message) + '</span>' + (action ? '<button type="button" data-toast-action>' + esc(action.label) + '</button>' : '');
  toast._action = action?.run || null;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.hidden = true;
    toast.innerHTML = '';
    toast._action = null;

}

function allChats() {
  return [...state.chats, ...sampleChats.filter(sample =>
    !state.chats.some(chat => chat.id === sample.id) && !state.deleted.includes(sample.id))];
}

function currentChat() {
  return allChats().find(chat => chat.id === state.activeChat);
}

function ensureChat(id) {
  let chat = state.chats.find(item => item.id === id);
  if (chat) return chat;
  const sample = sampleChats.find(item => item.id === id);
  if (!sample || state.deleted.includes(id)) return null;
  chat = { ...sample, messages: sample.messages.map(message => ({ ...message })) };
  state.chats.unshift(chat);
  return chat;
}

function editableChat() {
  const current = currentChat();
  const ensured = current ? ensureChat(current.id) : null;
  if (ensured) return ensured;
  const copy = { id: uid(), title: '', date: today, messages: [] };
  state.chats.unshift(copy);
  state.activeChat = copy.id;
  return copy;
}

function renderHistory() {
  const scroller = $('#history');
  const scrollTop = scroller.scrollTop;
  $('.search').hidden = selecting;
  $('#sidebar-footer').hidden = selecting;
  $('#select-actions').hidden = !selecting;
  const query = selecting ? '' : $('#history-search').value.trim().toLowerCase();
  const chats = allChats().sort(byDate).filter(chat => !query || [chat.title || '', ...chat.messages.map(m => m.text || '')].some(text => text.toLowerCase().includes(query)));
  const heading = label => '<div class="history-heading">' + esc(label) + '</div>';
  const row = chat => {
    const days = Math.round((dateObject(today) - dateObject(chat.date)) / 86400000);
    const time = days === 0 ? '今天' : days < 30 ? days + '天前' : Number(chat.date.slice(8)) + '日';
    const active = chat.id === state.activeChat ? ' active' : '';
    const pin = state.pinned.includes(chat.id) ? '<span class="pin-mark" aria-label="已置顶">●</span>' : '';
    return '<div class="history-row' + active + '"><button class="history-item" data-chat="' + esc(chat.id) + '"><span>' + esc(chat.title) + '</span><small>' + pin + esc(time) + '</small></button>' +
      '<button class="history-more" data-chat-menu="' + esc(chat.id) + '" aria-label="会话操作">' + glyph('more-dots') + '</button></div>';
  };
  const selectRow = chat => {
    const chosen = selectedChats.has(chat.id);
    return '<div class="history-row select-row' + (chosen ? ' selected' : '') + '">' +
      '<button class="history-item select-item" data-select-chat="' + esc(chat.id) + '" aria-pressed="' + chosen + '">' +
      '<span class="select-check' + (chosen ? ' on' : '') + '" aria-hidden="true"></span>' +
      '<span class="select-title">' + esc(chat.title) + '</span></button></div>';
  };
  const grouped = (list, render) => {
    let section = '';
    return list.map(chat => {
      const days = Math.round((dateObject(today) - dateObject(chat.date)) / 86400000);
      const group = days < 7 ? '7天内' : days < 30 ? '30天内' : chat.date.slice(0,4) + '年' + Number(chat.date.slice(5,7)) + '月';
      const label = group !== section ? heading(group) : '';
      section = group;
      return label + render(chat);
    }).join('');
  };
  if (selecting) {
    const body = chats.length ? grouped(chats, selectRow) : '<p class="empty">没有找到会话。</p>';
    scroller.innerHTML = '<div class="history-heading select-head"><span>选择对话</span><button class="icon-button select-close" data-action="exit-select" aria-label="退出选择">' + glyph('close-circle') + '</button></div>' + body;
  } else {
    const pinned = chats.filter(chat => state.pinned.includes(chat.id));
    const rest = chats.filter(chat => !state.pinned.includes(chat.id));
    const body = (pinned.length ? heading('置顶') + pinned.map(row).join('') : '') +
      (rest.length ? grouped(rest, row) : (pinned.length ? '' : '<p class="empty">没有找到会话。</p>'));
    scroller.innerHTML = '<div class="history-heading"><span>会话历史</span><button class="icon-button" data-action="select-chats" aria-label="多选">' + glyph('multiselect') + '</button></div>' + body;
  }
  scroller.scrollTop = scrollTop;
  syncSelectActions();
}

function deleteSelectedChats() {

  ids.forEach(id => {

    const chat = index >= 0 ? state.chats[index] : sampleChats.find(item => item.id === id);
    if (!chat) return;
    backups.push({ id, chat, index, sample: isSample, pinned: state.pinned.includes(id) });
    if (index >= 0) state.chats.splice(index, 1);
    if (isSample && !state.deleted.includes(id)) state.deleted.push(id);
  });
  state.pinned = state.pinned.filter(id => !ids.includes(id));
  if (ids.includes(state.activeChat)) state.activeChat = '';
  persist();
  exitSelectMode();
  renderChat();
  notify('已删除 ' + backups.length + ' 个会话', { label: '撤销', run: () => {
    backups.forEach(backup => {
      if (backup.index >= 0) state.chats.splice(Math.min(backup.index, state.chats.length), 0, backup.chat);
      state.deleted = state.deleted.filter(id => id !== backup.id);
      if (backup.pinned && !state.pinned.includes(backup.id)) state.pinned.push(backup.id);
    });
    if (ids.includes(previousActive)) state.activeChat = previousActive;
    persist();
    renderChat();
    renderHistory();
  } });
}

const replyBank = [
  { r:'她把这句话说出来了。先接住，不急着分析，也不要马上给建议。可以顺着她刚才说的，问一个具体一点的小问题。',
    t:'我听见了。\n\n你愿意再多说一点吗？不着急，想到哪儿说到哪儿。' },
  { r:'今天她好像有点累，但没有直接说。先不追问，陪她把这一段慢慢放下来。',
    t:'嗯，我在。\n\n不用急着把今天讲清楚，先歇一会儿也可以。' },
  { r:'她提到的事有两件：一件是当下在做的，一件是心里放着的。先回应当下，再把后面那件轻轻记下来。',
    t:'那就先从眼前这件小事开始吧。\n\n剩下的，等你想说的时候再说，我都留着耳朵。' },
  { r:'这句话里有一点没说出口的情绪。不要替她命名，只把位置留出来，让她自己决定要不要往下讲。',
    t:'我在这里。\n\n如果想说，就说；不想说，坐一会儿也很好。' }
];

function replyFor(text) {
  return replyBank[(text.length + Math.floor(Date.now() / 1000)) % replyBank.length];
}

function schedule(fn, ms) {
  const id = setTimeout(() => {
    generation?.timers.delete(id);
    fn();
  }, ms);
  generation?.timers.add(id);
  return id;
}

function startReply(chat, replaceId = '', afterId = '') {
  if (generation) return;
  const lastUser = [...chat.messages].reverse().find(message => message.role === 'user');
  const reply = replyFor(lastUser?.text || '');
  const message = { id: uid(), role: 'bot', time: timeNow(), text: '', reasoning: '', thinkMs: 0, streaming: true };
  const replaceIndex = replaceId ? chat.messages.findIndex(item => item.id === replaceId) : -1;
  if (replaceIndex >= 0) chat.messages[replaceIndex] = message;
  else if (afterId) {
    const index = chat.messages.findIndex(item => item.id === afterId);
    chat.messages.splice(index >= 0 ? index + 1 : chat.messages.length, 0, message);
  } else chat.messages.push(message);
  generation = { chatId: chat.id, messageId: message.id, phase: 'thinking', reasoning: '', timers: new Set(), startedAt: Date.now(), timer: 0 };
  if (state.activeChat === chat.id) renderChat(true); else syncComposer();
  schedule(() => {
    if (!generation || generation.stop) return;
    if (state.think) beginReasoning(chat, message, reply);
    else beginBody(chat, message, reply);
  }, state.think ? 900 : 550);
}

function beginReasoning(chat, message, reply) {
  if (!generation || generation.stop) return;
  generation.phase = 'reasoning';
  let index = 0;
  const tick = () => {
    if (!generation || generation.stop) return;
    index = Math.min(reply.r.length, index + 2);
    generation.reasoning = reply.r.slice(0, index);
    const live = $('#live-reasoning');
    if (live) {
      live.textContent = generation.reasoning;
      const region = $('#messages');
      if (region.scrollHeight - region.clientHeight - region.scrollTop < 80) region.scrollTop = region.scrollHeight;
    } else if (state.activeChat === chat.id) renderChat(true);
    if (index >= reply.r.length) {
      message.thinkMs = Math.max(1, Math.round((Date.now() - generation.startedAt) / 1000));
      schedule(() => beginBody(chat, message, reply), 260);
      return;
    }
    generation.timer = schedule(tick, 38);
  };
  if (state.activeChat === chat.id) renderChat(true);
  tick();
}

function beginBody(chat, message, reply) {
  if (!generation || generation.stop) return;
  generation.phase = 'body';
  message.reasoning = generation.reasoning || '';
  message.thinkMs = message.thinkMs || 0;
  if (state.activeChat === chat.id) renderChat(true);
  let index = 0;
  const full = reply.t;
  const tick = () => {
    if (!generation || generation.stop) return;
    const step = Math.max(1, Math.round(full.length / 70));
    index = Math.min(full.length, index + step);
    message.text = full.slice(0, index);
    const bubble = document.querySelector('[data-message-id="' + message.id + '"] .bubble');
    if (bubble) bubble.textContent = message.text;
    const region = $('#messages');
    if (region.scrollHeight - region.clientHeight - region.scrollTop < 80) region.scrollTop = region.scrollHeight;
    if (index >= full.length) { finishGeneration(chat, false); return; }
    generation.timer = schedule(tick, 26);
  };
  tick();
}

function finishGeneration(chat, stopped = false) {
  if (!generation) return;
  const gen = generation;
  clearTimeout(gen.timer);
  gen.timers.forEach(clearTimeout);
  generation = null;
  const target = chat || allChats().find(item => item.id === gen.chatId);
  const message = target?.messages.find(item => item.id === gen.messageId);
  if (target && message) {
    message.streaming = false;
    message.thinkMs = message.thinkMs || Math.max(1, Math.round((Date.now() - gen.startedAt) / 1000));
    if (!message.text) target.messages.splice(target.messages.indexOf(message), 1);
    else if (!message.reasoning) message.thinkMs = 0;
    persist();
  }
  if (target && state.activeChat === target.id) renderChat();
  else syncComposer();
  processQueues();
}

function processQueues() {
  if (generation) return;
  for (const chat of allChats()) {
    const next = chat.messages.find(message => message.queued);
    if (!next) continue;
    next.queued = false;
    persist();
    startReply(chat, '', next.id);
    return;
  }
}

function stopGeneration() {
  if (!generation || generation.chatId !== state.activeChat) return;
  finishGeneration(currentChat(), true);
}

function sendMessage(chat, text) {
  chat.title ||= text.slice(0, 22);
  chat.date = today;
  const message = { id: uid(), role: 'user', text, time: timeNow() };
  chat.messages.push(message);
  if (generation) message.queued = true;
  persist();
  renderChat(true);
  if (!generation) startReply(chat);
}

let rulerDate = today;

function mountDiaryRuler() {
  const ruler = $('#diary-ruler');
  const track = $('.diary-ruler-track');
  const recordedDates = new Set(entries.map(entry => entry.date));
  const startDate = [...recordedDates].reduce((earliest,date) => date < earliest ? date : earliest, today);
  const millisecondsPerDay = 86400000;
  const step = 32;
  const asTimestamp = date => Date.parse(date + 'T00:00:00Z');
  const start = asTimestamp(startDate);
  const last = Math.round((asTimestamp(today) - start) / millisecondsPerDay);
  const clamp = index => Math.max(0, Math.min(last, index));
  const dateAt = index => new Date(start + index * millisecondsPerDay).toISOString().slice(0,10);
  const indexAtCenter = () => clamp(Math.round(ruler.scrollLeft / step));
  let current = clamp(Math.round((asTimestamp(rulerDate) - start) / millisecondsPerDay));
  let committed = current;
  let timer;
  let drag;
  let suppressClick = false;

  ruler.style.setProperty('--ruler-span', last * step + 'px');
  ruler.setAttribute('aria-valuemin','0');
  ruler.setAttribute('aria-valuemax', String(last));
  ruler.scrollLeft = current * step;

  function renderTicks() {
    const date = dateAt(current);
    const status = recordedDates.has(date) ? '，有日记' : '，当天没有日记';
    ruler.setAttribute('aria-valuenow', String(current));
    ruler.setAttribute('aria-valuetext', readableDate(date) + status);
    const ticks = [];
    for (let index = Math.max(0,current - 10); index <= Math.min(last,current + 10); index++) {
      const tickDate = dateAt(index);
      const month = Number(tickDate.slice(5,7));
      const day = Number(tickDate.slice(8,10));
      const selected = index === current;
      const label = selected || day === 1 ? month + '/' + day : day;
      ticks.push('<span class="diary-ruler-tick' + (recordedDates.has(tickDate) ? ' has-entry' : '') +
        (selected ? ' selected' : '') + '" data-ruler-index="' + index +
        '" style="left:calc((100% - var(--ruler-span)) / 2 + ' + index * step + 'px)">' + label + '</span>');
    }
    track.innerHTML = ticks.join('');
  }

  function choose(index) {
    if (!ruler.isConnected || currentPage !== 'diary') return;
    current = clamp(index);
    ruler.scrollLeft = current * step;
    renderTicks();
    if (committed === current) return;
    committed = current;
    rulerDate = dateAt(current);
    document.querySelector('.entry[data-date="' + rulerDate + '"]')?.scrollIntoView({block:'center'});
  }

  function snapAfterScroll() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!drag?.moving) choose(indexAtCenter());
    }, 140);
  }

  ruler.addEventListener('scroll', () => {
    const index = indexAtCenter();
    if (index !== current) {
      current = index;
      renderTicks();
    }
    snapAfterScroll();
  });
  ruler.addEventListener('wheel', event => {
    if (Math.abs(event.deltaX) >= Math.abs(event.deltaY) || event.ctrlKey || last === 0) return;
    event.preventDefault();
    const unit = event.deltaMode === 1 ? step : event.deltaMode === 2 ? ruler.clientWidth : 1;
    ruler.scrollLeft += event.deltaY * unit;
  }, {passive:false});
  ruler.addEventListener('keydown', event => {
    const targets = { ArrowLeft:current - 1, ArrowRight:current + 1, ArrowDown:current - 1, ArrowUp:current + 1,
      PageDown:current - 7, PageUp:current + 7, Home:0, End:last };
    if (!Object.hasOwn(targets,event.key)) return;
    event.preventDefault();
    choose(targets[event.key]);
  });
  ruler.addEventListener('click', event => {
    const tick = event.target.closest('[data-ruler-index]');
    if (tick && !suppressClick) choose(Number(tick.dataset.rulerIndex));
  });
  ruler.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' && event.button === 0) {
      drag = { x:event.clientX, start:ruler.scrollLeft, moving:false };
    }
  });
  ruler.addEventListener('pointermove', event => {
    if (!drag) return;
    if (event.buttons !== 1) {
      drag = null;
      return;
    }
    const delta = event.clientX - drag.x;
    if (!drag.moving && Math.abs(delta) < 4) return;
    if (!drag.moving) ruler.setPointerCapture(event.pointerId);
    drag.moving = true;
    ruler.scrollLeft = drag.start - delta;
  });
  function finishDrag() {
    if (drag?.moving) {
      suppressClick = true;
      setTimeout(() => suppressClick = false, 0);

  }).join('');

function deleteMessage(item) {
  const chat = item?.chat;
  const message = item?.message;
  if (!chat || !message) return;
  const target = ensureChat(chat.id) || chat;
  const index = target.messages.findIndex(entry => entry.id === message.id);
  if (index < 0) return;
  if (target.messages[index].role === 'user' && target.messages[index + 1]?.role === 'bot') target.messages.splice(index, 2);
  else target.messages.splice(index, 1);
  persist();
  if (state.activeChat === target.id) renderChat(); else syncComposer();
  notify('已删除');
}

function messageAction(action, item) {

  if (action === 'select-text') {
    openSheet('选择文本','<textarea class="field" readonly aria-label="聊天文本">' + esc(message.text) + '</textarea>');
    $('#sheet-body textarea').select();
  }
  if (action === 'favorite') toggleFavorite({ key: 'chat:' + message.id, text: message.text, date: item.chat.date, time: message.time, chatId: item.chat.id });
  if (action === 'message-diary') writeEntry(message.text);
  if (action === 'edit') {
    openSheet('编辑消息', '<form id="edit-chat" data-message="' + esc(message.id) + '"><label>消息<textarea class="field" name="body" maxlength="3000" required>' +
      esc(message.text) + '</textarea></label><div class="dialog-actions"><button class="primary" type="submit">保存</button></div></form>');
  }
  if (action === 'delete-message') deleteMessage(item);
  if (action === 'multi-select') { enterMessageSelect(); return; }
  if (action === 'retry') {
    if (generation) { notify('还在回复中'); return; }
    startReply(editableChat(), message.id);
  }
}

function renameChat(id) {
  const chat = allChats().find(item => item.id === id);
  if (!chat) return;
  openSheet('重命名会话', '<form id="rename-chat" data-id="' + esc(id) + '"><label>会话名<input class="field" name="title" value="' + esc(chat.title) + '" maxlength="30" required></label><div class="dialog-actions"><button class="primary" type="submit">保存</button></div></form>');
}

function togglePin(id) {
  const index = state.pinned.indexOf(id);
  if (index >= 0) state.pinned.splice(index, 1);
  else state.pinned.unshift(id);
  persist();
  renderHistory();
  notify(index >= 0 ? '已取消置顶' : '已置顶');
}

function deleteChat(id) {
  const chat = allChats().find(item => item.id === id);
  if (!chat) return;
  const saved = state.chats.findIndex(item => item.id === id);
  const isSample = sampleChats.some(item => item.id === id);
  const wasActive = state.activeChat === id;
  if (saved >= 0) state.chats.splice(saved, 1);
  if (isSample && !state.deleted.includes(id)) state.deleted.push(id);
  state.pinned = state.pinned.filter(item => item !== id);
  persist();
  if (wasActive) newChat(); else renderHistory();
  notify('会话已删除', { label: '撤销', run: () => {
    if (saved >= 0) state.chats.splice(Math.min(saved, state.chats.length), 0, chat);
    state.deleted = state.deleted.filter(item => item !== id);
    persist();
    if (wasActive) { state.activeChat = id; navigate('chat'); }
    renderHistory();
  } });
}

function prefToggle(kind, key, label) {
  const store = kind === 'tool' ? state.tools : state.perms;
  return '<label class="setting-row">' + label + '<input class="toggle" type="checkbox" data-' + kind + '="' + key + '"' + (store[key] ? ' checked' : '') + '></label>';
}

function showTools() {
  openSheet('工具管理', '<p class="caption">每个工具都能单独关掉，关掉后小D就不能再调用它。</p><div class="stack">' +
    prefToggle('tool','memo','备忘录') + prefToggle('tool','diary','日记') + prefToggle('tool','calendar','日历') +
    prefToggle('tool','notify','通知读取') + prefToggle('tool','files','文件') + prefToggle('tool','web','网页读取') + '</div>');
}

function showPermissions() {
  openSheet('手机权限', '<p class="caption">这些是手机系统层面的权限，和小D能用的工具分开。</p><div class="stack">' +
    prefToggle('perm','notifications','通知读取') + prefToggle('perm','usage','应用使用统计') +
    prefToggle('perm','photos','相册') + prefToggle('perm','camera','相机') +
    prefToggle('perm','calendar','日历') + prefToggle('perm','battery','电量与充电') +
    prefToggle('perm','location','位置') + prefToggle('perm','mail','邮箱') + '</div>');
}

function syncComputerIcon() {
  const button = $('#computer-status');
  if (!button) return;
  button.hidden = !state.computer;
  button.setAttribute('aria-label', state.computer ? '电脑在线，查看连接' : '电脑离线');
}

const menuActions = {
  'copy': '复制', 'select-text': '选择文本', 'favorite': '收藏', 'retry': '重新生成', 'edit': '编辑', 'message-diary': '收入日记', 'multi-select': '多选', 'delete-message': '删除'
};
const commands = {
  'open-sidebar': () => toggleSidebar(true),
  'new-chat': newChat,
  'select-chats': enterSelectMode,
  'exit-select': exitSelectMode,
  'back': () => {
    const target = currentPage === 'single' ? singleReturn : 'chat';
    navigate(target);
    if (target === 'chat' && drawerReturn) {
      drawerReturn = false;
      toggleSidebar(true, false);
    }
  },
  'close-dialog': button => button.closest('dialog').close(),
  'write-entry': () => writeEntry(),
  'plan-detail': () => openSheet('本周运动计划', '<div class="stack">' + weekPlan.map(([day, text]) =>
    '<div class="setting-row">' + day + '<span class="caption">' + text + '</span></div>').join('') +
    '</div><p class="caption">计划还是示例数据，之后可以按周编辑。</p>'),
  'models': models,
  'add-memory': () => editMemory(),
  'connection': () => navigate('connection'),
  'stop': stopGeneration,
  'exit-chat-select': exitMessageSelect,
  'select-all-messages': toggleSelectAllMessages,
  'delete-selected-messages': deleteSelectedMessages,
  'open-export': openExportSheet,
  'export-messages-photo': exportSelectedPhoto,
  'export-messages-doc': exportSelectedDoc,
  'open-calendar': () => {
    renderCalendar();
    $('#calendar').showModal();
  },
  'calendar-prev': () => moveCalendar(-1),
  'calendar-next': () => moveCalendar(1),
  'calendar-view': () => {
    if (!entries.some(entry => entry.date === selectedDate)) { notify('这天还没有日记'); return; }
    $('#calendar').close();
    rulerDate = selectedDate;
    if (currentPage !== 'diary') navigate('diary');
    setTimeout(() => document.querySelector('.entry[data-date="' + selectedDate + '"]')?.scrollIntoView({ block: 'center' }), 60);
  },
  'attach': () => openSheet('添加图片', '<p class="caption">原型先留入口。接上相机和相册以后，可以发截图、照片，也能让小D看图。</p>'),
  'rename-chat': () => renameChat(menuChatId),
  'pin-chat': () => togglePin(menuChatId),
  'unpin-chat': () => togglePin(menuChatId),
  'delete-chat': () => deleteChat(menuChatId),
  'tools': showTools,
  'plugins': () => openSheet('插件', '<p class="caption">先留空。之后可以放网页读取、翻译这类扩展。</p>'),
  'permissions': showPermissions,
  'backup': () => openSheet('备份与导出', '<p class="caption">把会话、日记、记忆和设置打成一个文件导出。M4 做。</p>'),
  'cache': () => openSheet('清理缓存', '<div class="stack"><div class="setting-row">文字与草稿<span class="caption">2.1 MB</span></div><div class="setting-row">图片<span class="caption">18.4 MB</span></div><div class="setting-row">文件<span class="caption">0 MB</span></div></div><div class="dialog-actions"><button class="primary" data-action="clear-cache">清理</button></div>'),
  'clear-cache': () => { $('#sheet').close(); notify('缓存已清理'); },
  'logs': () => openSheet('日志', '<p class="reading">13:04 启动 · 本地模式\n13:05 载入 3 段示例会话\n13:12 模型切换为 DS-flash\n13:12 上下文占用 12%</p>'),
  'reset': () => {
    if (!confirm('清空原型数据，恢复示例？')) return;
    localStorage.removeItem(prototypeKey);
    localStorage.removeItem(storageKey);
    location.reload();
  },
  'disconnect': () => { state.computer = false; persist(); syncComputerIcon(); renderPage('connection'); notify('已断开电脑'); },
  'connect': () => { state.computer = true; persist(); syncComputerIcon(); renderPage('connection'); notify('电脑已连接'); }
};

function moveCalendar(step) {
  calendarMonth = new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+step,1,12);
  selectedDate = localDate(calendarMonth);
  renderCalendar();
}

document.addEventListener('click', event => {
  const toastButton = event.target.closest('[data-toast-action]');
  if (toastButton) {
    const toast = $('#toast');
    const run = toast._action;
    toast.hidden = true;
    toast.innerHTML = '';
    toast._action = null;
    run?.();
    return;
  }
  if (longPressFired) {
    longPressFired = false;
    if (event.target.closest('#messages')) return;
  }
  if (chatSelecting) {
    const article = event.target.closest('#messages [data-message-id]');
    if (article) {
      toggleMessageSelection(article.dataset.messageId);
      return;
    }
  }
  const button = event.target.closest('button');
  if (!button) {
    if (!event.target.closest('#menu')) closeMenu();
    return;
  }
  const data = button.dataset;
  if (data.thought) {
    closeMenu();
    const chat = currentChat();
    const message = chat?.messages.find(item => item.id === data.thought);
    if (message?.reasoning) openSheet('思考过程', '<p class="reading">' + esc(message.reasoning) + '</p>');
    return;
  }
  if (data.chatMenu) {
    closeMenu();
    menuChatId = data.chatMenu;
    const pinned = state.pinned.includes(menuChatId);
    showMenu(button, [['rename-chat','重命名'], [pinned ? 'unpin-chat' : 'pin-chat', pinned ? '取消置顶' : '置顶'], ['delete-chat','删除']]);
    return;
  }
  if (data.selectAction) {
    closeMenu();
    if (data.selectAction === 'pin') pinSelectedChats();
    else if (data.selectAction === 'delete') deleteSelectedChats();
    return;
  }
  if (data.selectChat) {
    closeMenu();
    toggleSelectChat(data.selectChat);
    return;
  }
  if (data.messageAction) {
    const chat = currentChat();
    const id = button.closest('[data-message-id]').dataset.messageId;
    const message = chat.messages.find(item => item.id === id);
    activeMessage = { chat, message };
    if (data.messageAction === 'more') {
      const actions = message.role === 'bot' ? ['copy','select-text','favorite','retry','message-diary','delete-message','multi-select'] : ['copy','select-text','favorite','edit','message-diary','delete-message','multi-select'];
      showMenu(button, actions.map(action => [action, menuActions[action]]));
    } else {
      closeMenu();
      messageAction(data.messageAction, activeMessage);
    }
    return;
  }
  const fromMenu = Boolean(button.closest('#menu'));
  closeMenu();
  if (data.action) {
    if (fromMenu && Object.hasOwn(menuActions,data.action)) messageAction(data.action, activeMessage);
    else commands[data.action]?.(button);
  } else if (data.go) {
    if (button.closest('#sidebar')) drawerReturn = true;
    navigate(data.go);
  } else if (data.chat) {
    resetMessageSelect();
    state.activeChat = data.chat;
    $('#chat-input').value = '';
    drawerReturn = false;
    persist();
    if (currentPage !== 'chat') renderPage('chat'); else renderChat(true);
    renderHistory();
    syncComposer();
  } else if (data.readEntry) {
    const entry = entries.find(item => item.id === data.readEntry);
    if (entry) readEntry(entry);
  } else if (data.editEntry) {
    const entry = entries.find(item => item.id === data.editEntry);
    if (entry) writeEntry(undefined, entry);
  } else if (data.deleteEntry) {
    const entry = entries.find(item => item.id === data.deleteEntry);
    if (entry) deleteEntry(entry);
  } else if (data.author) {
    selectedAuthor = data.author;
    singleReturn = currentPage;
    navigate('single');
  } else if (data.calendarDate) {
    selectedDate = data.calendarDate;
    renderCalendar();
    $('#calendar-days button[aria-pressed=true]')?.focus();
  } else if (data.favoriteEntry) {
    const entry = entries.find(item => item.id === data.favoriteEntry);
    if (!entry) return;
    toggleFavorite({ key: 'diary:' + entry.id, title: entry.title, text: entry.body, date: entry.date });
    readEntry(entry);
  } else if (data.jumpChat) jumpToMessage(data.jumpChat, data.jumpMessage);
  else if (data.openFavorite) readFavorite(data.openFavorite);
  else if (data.removeFavorite) {
    const item = state.favorites.find(favorite => favorite.key === data.removeFavorite);
    if (item) toggleFavorite(item);
    $('#sheet').close();
  } else if (data.memory) editMemory(data.memory);
  else if (data.removeMemory) {
    if (!confirm('删除这条记忆？')) return;
    state.memories = state.memories.filter(item => item.id !== data.removeMemory);
    persist();
    renderPage('memory');
    $('#sheet').close();
  } else if (data.memoToggle) {
    const memo = state.memos.find(item => item.id === data.memoToggle);
    if (!memo) return;
    memo.done = !memo.done;
    persist();
    button.closest('.memo-row')?.classList.toggle('done', memo.done);
    button.setAttribute('aria-pressed', String(memo.done));
    button.setAttribute('aria-label', memo.done ? '标记为未完成' : '标记为完成');
  } else if (data.editMemo) {
    const memo = state.memos.find(item => item.id === data.editMemo);
    if (memo) writeMemo(memo.period, memo);
  } else if (data.memoDelete) deleteMemo(data.memoDelete);
  else if (data.addMemo) writeMemo(data.addMemo);
  else if (data.model || data.effort || data.font || data.theme) {
    const pref = ['model','effort','font','theme'].find(name => data[name]);
    state[pref] = data[pref];
    persist();
    if (pref === 'model') $('#model-sheet').close();
    if (pref === 'effort') {
      $('#model-content').querySelectorAll('[data-effort]').forEach(node => {
        node.setAttribute('aria-pressed', String(node.dataset.effort === state.effort));
      });
    }
    if (pref === 'font' || pref === 'theme') {
      applySettings();
      document.querySelectorAll('[data-' + pref + ']').forEach(node => node.setAttribute('aria-pressed',String(node.dataset[pref] === state[pref])));
    }
    syncComposer();
  }
});

document.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  if (form.id === 'composer') {
    const input = $('#chat-input');
    const text = input.value.trim();
    if (!text) return;
    const chat = editableChat();
    input.value = '';
    sendMessage(chat, text);
    syncComposer();
    return;
  }
  if (form.id === 'rename-chat') {
    const title = String(new FormData(form).get('title') || '').trim();
    if (!title) return;
    const chat = ensureChat(form.dataset.id);
    if (chat) { chat.title = title; persist(); renderHistory(); }
    $('#sheet').close();
    return;
  }
  const fields = new FormData(form);
  const body = String(fields.get('body') || '').trim();
  if (!body) {
    form.elements.body.focus();
    return;
  }
  if (form.id === 'entry-form') {
    const title = String(fields.get('title')).trim();
    const date = String(fields.get('date'));
    if (!title || !date || date > today) return;
    const existing = entries.find(item => item.id === form.dataset.id);
    const entry = existing || { id: uid(), author: 'me', date, title, body };
    if (existing) { existing.date = date; existing.title = title; existing.body = body; }
    else entries.push(entry);
    rulerDate = date;
    diaryDraft = null;
    const savedEntry = save();
    $('#sheet').close();
    if (currentPage !== 'diary') navigate('diary');
    else renderPage('diary');
    if ($('#reading').open) openReading(entry);
    updateUnread();
    document.querySelector('[data-entry-id="' + CSS.escape(entry.id) + '"]')?.scrollIntoView({block:'center'});
    notify(savedEntry ? '日记已保存' : '浏览器无法保存，日记暂留在当前页面。');
  } else if (form.id === 'memory-form') {
    const item = state.memories.find(memory => memory.id === form.dataset.id);
    if (item) item.text = body;
    else state.memories.unshift({id: uid(), text: body});
    persist();
    renderPage('memory');
    $('#sheet').close();
  } else if (form.id === 'edit-chat') {
    const chat = editableChat();
    const message = chat.messages.find(item => item.id === form.dataset.message);
    if (message) {
      const index = chat.messages.indexOf(message);
      message.text = body;
      message.queued = false;
      chat.messages.splice(index + 1);
      persist();
      $('#sheet').close();
      renderChat();
      if (!generation) startReply(chat);
    }
  } else if (form.id === 'memo-form') {
    const item = state.memos.find(memo => memo.id === form.dataset.id);
    if (item) item.text = body;
    else state.memos.push({ id: uid(), period: form.dataset.period, text: body, done: false });
    persist();
    $('#sheet').close();
    const y = scrollY;
    renderPage('notes');
    scrollTo(0, y);
  }
});

$('#chat-input').addEventListener('input', syncComposer);
$('#chat-input').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    $('#composer').requestSubmit();
  }
});
$('#history-search').addEventListener('input', renderHistory);
$('#scrim').addEventListener('click', () => toggleSidebar(false));
$('#reading').addEventListener('click', event => { if (event.target === event.currentTarget) $('#reading').close(); });
function cancelLongPress() {
  clearTimeout(pressTimer);
  pressOrigin = null;
}
$('#messages').addEventListener('scroll', () => { closeMenu(); cancelLongPress(); });
$('#messages').addEventListener('pointerdown', event => {
  if (chatSelecting) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;
  const article = event.target.closest('[data-message-id]');
  if (!article || event.target.closest('button, textarea, input')) return;
  cancelLongPress();
  pressOrigin = { x: event.clientX, y: event.clientY };
  pressTimer = setTimeout(() => {
    pressOrigin = null;
    if (chatSelecting) return;
    const chat = currentChat();
    const message = chat?.messages.find(item => item.id === article.dataset.messageId);
    if (!message) return;
    activeMessage = { chat, message };
    navigator.vibrate?.(8);
    longPressFired = true;
    setTimeout(() => { longPressFired = false; }, 700);
    const actions = message.role === 'bot'
      ? ['copy','select-text','favorite','retry','message-diary','delete-message','multi-select']
      : ['copy','select-text','favorite','edit','message-diary','delete-message','multi-select'];
    showMenu(article, actions.map(action => [action, menuActions[action]]));
  }, 520);
});
$('#messages').addEventListener('pointermove', event => {
  if (!pressOrigin) return;
  if (Math.hypot(event.clientX - pressOrigin.x, event.clientY - pressOrigin.y) > 8) cancelLongPress();
});
['pointerup', 'pointercancel'].forEach(type => $('#messages').addEventListener(type, cancelLongPress));
$('#history').addEventListener('contextmenu', event => {
  const row = event.target.closest('[data-chat]');
  if (!row) return;
  event.preventDefault();
  menuChatId = row.dataset.chat;
  const pinned = state.pinned.includes(menuChatId);
  showMenu(row, [['rename-chat','重命名'], [pinned ? 'unpin-chat' : 'pin-chat', pinned ? '取消置顶' : '置顶'], ['delete-chat','删除']]);
});
$('#messages').addEventListener('contextmenu', event => {
  cancelLongPress();
  const article = event.target.closest('[data-message-id]');
  if (!article) return;
  event.preventDefault();
  if (chatSelecting) return;
  const chat = currentChat();
  const message = chat?.messages.find(item => item.id === article.dataset.messageId);
  if (!message) return;
  activeMessage = { chat, message };
  longPressFired = true;
  setTimeout(() => { longPressFired = false; }, 700);
  const actions = message.role === 'bot'
    ? ['copy','select-text','favorite','retry','message-diary','delete-message','multi-select']
    : ['copy','select-text','favorite','edit','message-diary','delete-message','multi-select'];
  showMenu(article.querySelector('.message-tools') || article, actions.map(action => [action, menuActions[action]]));
});
document.addEventListener('input', event => {
  if (event.target.form?.id === 'entry-form') {
    const { date, title, body } = event.target.form.elements;
    diaryDraft = { date: date.value, title: title.value, body: body.value };
  }
  if (event.target.id === 'font-range') {
    state.fontSize = Number(event.target.value);
    applySettings();
    persist();
  }
});
document.addEventListener('change', event => {
  const { tool, perm } = event.target.dataset;
  if (tool) { state.tools[tool] = event.target.checked; persist(); return; }
  if (perm) { state.perms[perm] = event.target.checked; persist(); return; }
  const name = event.target.dataset.pref;
  if (!name) return;
  state[name] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
  persist();
  if (name === 'think') {
    $('#model-content').querySelectorAll('[data-effort]').forEach(button => button.disabled = !state.think);
    syncComposer();
  }
});
document.addEventListener('keydown', event => {
  if (chatSelecting && (event.key === ' ' || event.key === 'Enter')) {
    const article = event.target.closest('[data-message-id]');
    if (article) { event.preventDefault(); toggleMessageSelection(article.dataset.messageId); return; }
  }
  if (event.key === 'Escape' && chatSelecting) { event.preventDefault(); exitMessageSelect(); return; }
  if (event.key === 'Escape' && !$('#menu').hidden) closeMenu(true);
  else if (event.key === 'Escape' && !$('#sidebar').hidden) {
    if (selecting) exitSelectMode(); else toggleSidebar(false);
  }
  if (event.key !== 'Tab' || $('#sidebar').hidden) return;
  const controls = [...$('#sidebar').querySelectorAll('button,input')].filter(element => element.getClientRects().length);
  if (event.shiftKey && document.activeElement === controls[0]) {
    event.preventDefault();
    controls.at(-1).focus();
  } else if (!event.shiftKey && document.activeElement === controls.at(-1)) {
    event.preventDefault();
    controls[0].focus();
  }
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', () => {
  if (location.hash.slice(1) !== currentPage) route();
});

setGreeting();
applySettings();
updateUnread();
syncComputerIcon();
route();

</script>
